<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منظومة مسار التجارية</title>
    <meta name="description" content="منظومة سحابية لإدارة المبيعات والمخازن ونقاط البيع وورش اللوافت الإعلانية" />
    <meta property="og:title" content="منظومة مسار التجارية" />
    <meta property="og:description" content="منظومة سحابية لإدارة المبيعات والمخازن ونقاط البيع وورش اللوافت الإعلانية" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const theme = localStorage.getItem('masar_theme') || (JSON.parse(localStorage.getItem('masar_settings') || '{}').theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0c1322] text-slate-900 dark:text-slate-100 font-['Tajawal','Cairo',sans-serif] antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
